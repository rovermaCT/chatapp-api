
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a .NET chat application. Review this pull request and focus on:
            - Bugs and logic errors
            - Security issues (input validation, auth, secrets, SQL injection)
            - Async/await misuse and thread-safety problems
            - Error handling and resource disposal
            - Naming, readability and maintainability

            Be concise. Group feedback by file, mark each point as
            critical, suggestion or nitpick, and skip praise.
            Post your review as a comment on the pull request.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
